<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | REACH</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #1a1a1a;
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                url('img/unavailable-page.avif');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
            text-align: center;
        }


        .container {
            max-width: 700px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }


        .logo-box {
            width: 120px;
            height: 120px;
            margin-bottom: 10px;
            animation: float 6s ease-in-out infinite;
        }

        .logo-box img {
            width: 100%;
            height: auto;

        }


        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            line-height: 1.1;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h1 span {
            color: #ff3b3b;
        }

        p {
            font-size: clamp(1rem, 2vw, 1.2rem);
            color: #e0e0e0;
            line-height: 1.6;
            max-width: 500px;
        }


        .notify-box {
            display: flex;
            width: 100%;
            max-width: 500px;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        input[type="email"] {
            flex: 1;
            padding: 15px 20px;
            border-radius: 50px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            backdrop-filter: blur(5px);
            min-width: 200px;
        }

        input[type="email"]::placeholder {
            color: #aaa;
        }



        button {
            padding: 15px 35px;
            border-radius: 50px;
            border: none;
            background-color: #ff3b3b;
            color: white;
            font-weight: 700;
            font-family: inherit;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }

        button:hover {
            background-color: white;
            color: black;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 59, 59, 0.4);
        }


        .footer {
            margin-top: 50px;
            font-size: 0.8rem;
            opacity: 0.6;
        }


        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0px);
            }
        }


        @media (max-width: 480px) {
            .notify-box {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo-box">
            <img src="icons/logos.png" alt="Reach Logo">
        </div>

        <h1>Sorry! Still in <span>Development</span> Right now</h1>

        <p>We're crafting a new way to explore the world. <br>
            Be the first to know when our journey begins.</p>

        <button onclick="window.location.href='home.html'">Notify Me</button>

        <div class="footer">
            &copy; 2024 Reach Travel. All rights reserved.
        </div>

    </div>

</body>

</html>
