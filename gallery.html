<!DOCTYPE html>
<html lang="en">

<head>

                <ul class="nav-links">
                    <li><a href="home.html" class="nav inactive">Home</a></li>
                    <li><a href="about.html" class="nav inactive">About</a></li>
                    <li><a href="#" class="nav active">Gallery</a></li>
                </ul>

                <div class="nav-actions">
                    <a href="#" class="btn-book">Book Now</a>
                    <div class="user-container">
                        <div class="user-icon">👤</div>

                    </div>
                </div>
                <!-- Hamburger -->
                <div class="hamburger-container">
                    <div class="hamburger">
                        <span class="bar"></span>
                        <span class="bar"></span>

                </div>
                <!-- For the Hamburger menu again -->
                <div class="tabletnav-container">

            <!-- Logout button here -->
            <div class="goback">

                    <div class="no">
                        <p class="no-btn">No</button>
                    </div>
                    <div class="yes">
                        <p class="yes-btn" onclick="window.location.href='login.html'">Logout</button>
                    </div>
                </div>
            </div>

            <div class="centered-title-container">
                <div class="hero-content centered-title">
