<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <title>Login Page</title>
</head>

<body>

    <div class="login-wrapper">

        <div class="left-pane">
            <div class="login-container">
                <header class="login-header">
                    <div class="logo-container">
                        <img src="icons/logo.png" alt="Reach logo" class="img">
                        <span class="brand-text">REACH</span>
                    </div>
                    <h1 class="title">Welcome Back!</h1>
                    <p class="subtitle">We Are Happy to See You Again</p>
                </header>

                <div class="signinup-container">
                    <div class="border-container">
                        <button type="button" class="Signin active-btn">Sign in</button>
                        <button type="button" class="Signup inactive-btn">Sign Up</button>
                    </div>
                </div>

                <form class="login-form">
                    <!--  -->
                    <div class="input-group">
                        <div class="email">
                            <input type="email" id="email" placeholder="Enter your email" required>
                        </div>
                    </div>
                    <div class="input-group hidden" id="name-group">
                        <div class="email"> <input type="text" id="nick-name" placeholder="Enter your nickname">
                            <p class="error hidden">Must be less than 10</p>
                        </div>
                    </div>
                    <div class="input-group">
                        <div class="password">
                            <input type="password" id="password" placeholder="Enter your password" required>
                            
                        </div>
                    </div>
                    <!--  -->



                    <div class="input-group hidden" id="confirm-group">
                        <div class="password"> <input type="password" id="confirm-password"
                                placeholder="Confirm your password">
                                <p class="passerror hidden">Password must be greater than 6</p>
                        </div>
                    </div>



                    <!--  -->
                    <div class="remember-forgot-container">
                        <label class="remember-me">
                            <input type="checkbox" name="remember">
                            <span class="checkmark"></span>
                            Remember me
                        </label>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>
                    <!--  -->
                    <button type="submit" class="btn-primary">Login</button>
                </form>

                <div class="divider">
                    <span class="divider-text">OR</span>
                </div>

                <div class="social-login-container">
                    <button type="button" class="btn-apple">
                        <span class="icon"><img src="icons/apple.png" alt="Apple Icon" id="apple"></span>
                        Login in with Apple
                    </button>
                    <button type="button" class="btn-google">
                        <span class="icon"><img src="icons/google.png" alt="Google Icon" id="google"></span>
                        Login in with Google
                    </button>
                </div>
            </div>
        </div>

        <div class="right-pane">
            <img src="img/login-right.jpg" alt="Snowy Mountain View" class="hero-image">
        </div>

    </div>

</body>
<script src="login.js"></script>

</html>
